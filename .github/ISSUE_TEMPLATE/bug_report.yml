name: Bug Report
description: Report a bug or issue with the Anticheat
labels: ["Bug"]
type: bug

body:
  - type: markdown
    attributes:
      value: "Before creating a Bug Report, please Update the Anticheat first, and check issues if the Bug has already been reported."
  
  - type: dropdown
    id: version_channel
    attributes:
      label: Version Channel
      options:
        - Stable (Default)
        - Canary
      default: 0
    validations:
      required: true
  
  - type: input
    id: anticheat_version
    attributes:
      label: Loader Version
      placeholder: I.e. 3.2.0
      description: You can find the Loader's Version in Loader > `Loader.luau` > `Loader.Version`
  
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: Please describe what exactly happened
      placeholder: Enter your description here!
    validations:
      required: true
  
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the bug you have found.
      placeholder: List the steps here!
    validations:
      required: true